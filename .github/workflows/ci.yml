name: Tirotir CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run test suite
        run: python -m pytest -q
      - name: CLI smoke
        run: |
          tirotir version
          tirotir check examples2/basics/hello_world.t
      - name: Example bundle harness
        run: python tirotir-2.0-examples/tests/run_examples.py
      - name: Build Python distributions
        run: |
          python -m pip install build
          python -m build
      - name: Validate extension metadata
        run: |
          python -m json.tool vscode-tirotirLang/package.json
          node --check vscode-tirotirLang/extension.js
